version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /etc]
  read_write: [/tmp, /dev/null]

landlock:
  compatibility: hard_requirement

network_policies:
  allow_example:
    name: allow-example-com
    endpoints:
      - host: example.com
        port: 80
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /bin/busybox
      - path: /usr/local/bin/python3.12
