version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /bin
    - /usr
    - /lib
    - /etc
    - /app
    - /var/log
  read_write:
    - /var/lib/threadline
    - /tmp

landlock:
  compatibility: hard_requirement

network_policies:
  # Direct OpenAI-compatible Token Factory access is restricted to this host,
  # API path, and Python runtime. The provider substitutes the real key.
  token_factory:
    endpoints:
      - host: api.tokenfactory.nebius.com
        port: 443
        path: /v1/**
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /usr/local/bin/python
      - path: /usr/local/bin/python3.12
