id: nebius-tokenfactory
display_name: Nebius Token Factory
description: OpenAI-compatible Nebius Token Factory API for Threadline inference
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: Nebius Token Factory API key
    env_vars: [NEBIUS_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: api.tokenfactory.nebius.com
    port: 443
    path: /v1/**
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/python
  - /usr/local/bin/python3.12
